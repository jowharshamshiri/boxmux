# Release binaries for the platforms the engine can make, brought back as products.
# scripts/release.sh runs this plan and downloads what it delivers.
apiVersion: test.machinegenesis.dev/v1
kind: TestPlan
metadata:
  name: release
targets:
  linux-x86-64:
    uses: ubuntu-2604-x86-64-pve
    resources: {cpu: 4, memory: 8GiB, disk: 64GiB}
    caches:
      tools: {}
      target: {}
  linux-arm64:
    uses: ubuntu-2604-arm64-pve
    resources: {cpu: 4, memory: 8GiB, disk: 64GiB}
    caches:
      tools: {}
      target: {}
  windows-x86-64:
    uses: windows-11-x86-64-pve
    allocationTimeout: 60m
    caches:
      tools: {}
      target: {}
tasks:
  build-linux-x86-64:
    target: linux-x86-64
    shell: bash
    command: sh mg-test/build.sh
    products: ['out/dist/*']
    evidence: [out/build.log]
  build-linux-arm64:
    target: linux-arm64
    shell: bash
    command: sh mg-test/build.sh
    products: ['out/dist/*']
    evidence: [out/build.log]
  build-windows-x86-64:
    target: windows-x86-64
    shell: powershell
    command: '& .\mg-test\build.ps1'
    products: ['out/dist/*']
    evidence: [out/build.log]
