[package]
name = "boxmux_gauge"
version = "0.1.0"
edition = "2021"
description = "Example boxmux plugin: horizontal gauges"
publish = false

# Not part of the boxmux package's build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
