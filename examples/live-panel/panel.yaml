# A live control panel driven by another program (driver.sh).
# Start it with examples/live-panel/start.sh; see the "Drive BoxMux as a live control panel"
# page of the documentation.
#
# The driver writes the files under $PANEL_STATE that the text boxes show, each redrawn when
# its file changes, and replaces the `needs` menu over the control socket, each approval with
# a `confirm` that asks before it runs. Buttons run buttons.sh, which reports presses, and the
# answers confirmed, back to the driver. start.sh exports PANEL_DIR (this folder) and
# PANEL_STATE (a temporary folder for the run): BoxMux substitutes ${PANEL_STATE} in the file
# paths when it loads this file, and the shell resolves $PANEL_DIR when the scripts run.
app:
  layouts:
    - id: main
      root: true
      title: Control panel
      children:
        - id: status
          title: Status
          position: {x1: "0%", y1: "0", x2: "100%", y2: "5"}
          border_color: bright_cyan
          overflow_behavior: truncate
          file: ${PANEL_STATE}/status.txt
        - id: needs
          title: Needs you
          position: {x1: "0%", y1: "5", x2: "100%", y2: "60%"}
          border_color: bright_yellow
          tab_order: 1
          selected: true
          overflow_behavior: wrap
          choices:
            - id: waiting
              content: Waiting for the driver to fill this in
        - id: detail
          title: Details
          position: {x1: "0%", y1: "60%", x2: "100%", y2: "80%"}
          border_color: white
          overflow_behavior: wrap
          file: ${PANEL_STATE}/detail.txt
        - id: log
          title: What the driver is doing
          position: {x1: "0%", y1: "80%", x2: "100%", y2: "100%"}
          border_color: green
          overflow_behavior: wrap
          file: ${PANEL_STATE}/log.txt
          follow: true

    - id: term
      title: Terminal
      children:
        - id: term_bar
          title: Terminal
          position: {x1: "0%", y1: "0", x2: "100%", y2: "3"}
          border_color: bright_cyan
          tab_order: 2
          choices:
            - id: term_back
              content: "◀ Back to the panel"
              script: ["\"$PANEL_DIR/buttons.sh\" back"]
        - id: term_box
          title: Run
          position: {x1: "0%", y1: "3", x2: "100%", y2: "100%"}
          border_color: bright_white
          tab_order: 1
          selected: true
          content: buttons.sh run starts the step here
