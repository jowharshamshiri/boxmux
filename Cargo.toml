[package]
name = "boxmux"
version = "0.284.679"
edition = "2021"
authors = ["Bahram Shamshiri <jowharshamshiri@gmail.com>"]
description = "YAML-driven terminal UI framework for rich, interactive CLI applications and dashboards with PTY support"
documentation = "https://docs.rs/boxmux"
homepage = "https://boxmux.com"
repository = "https://github.com/jowharshamshiri/boxmux"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "tui", "yaml", "dashboard", "pty"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/build.rs",
    "/build/*.rs",
    "/src/**/*.rs",
    "/schemas/app_schema.json",
    "/tests/**/*.rs",
    "/layouts/*.yaml",
    "/examples/*.yaml",
    "/examples/*.sh",
    "/examples/plugins/*/Cargo.toml",
    "/examples/plugins/*/src/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
name = "boxmux_lib"
path = "src/lib.rs"

[[bin]]
name = "boxmux"
path = "src/main.rs"

# Runs itself as a child process that panics, so it has its own main.
[[test]]
name = "panic_cleanup"
harness = false

[dependencies]
chrono = "0.4"
clap = "4.0"
crossbeam-channel = "0.5"
crossterm = "0.29"
env_logger = "0.11"
indexmap = "2.0"
interprocess = "2.4"
jsonschema = { version = "0.59", default-features = false }
libloading = "0.9"
log = "0.4"
portable-pty = "0.9"
regex = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
vte = "0.15"

[target."cfg(unix)".dependencies]
libc = "0.2"
signal-hook = "0.4"

[target."cfg(windows)".dependencies]
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
tempfile = "3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# A panic anywhere is fatal: the panic hook restores the terminal, then the process aborts
# instead of continuing with a dead worker thread.
panic = "abort"

[package.metadata.deb]
maintainer = "Bahram Shamshiri <jowharshamshiri@gmail.com>"
copyright = "2024, Bahram Shamshiri <jowharshamshiri@gmail.com>"
license-file = ["LICENSE", "4"]
extended-description = "BoxMux is a YAML-driven terminal UI framework that enables developers to create rich, interactive CLI applications and dashboards through simple configuration files. Features include PTY support, real-time updates, scripting integration, and multi-threaded architecture for responsive terminal interfaces."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/boxmux", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/boxmux/README", "644"],
    ["layouts/*.yaml", "usr/share/doc/boxmux/layouts/", "644"],
    ["examples/*.yaml", "usr/share/doc/boxmux/examples/", "644"],
    ["examples/*.sh", "usr/share/doc/boxmux/examples/", "755"],
]

[package.metadata.generate-rpm]
summary = "YAML-driven terminal UI framework"
assets = [
    { source = "target/release/boxmux", dest = "/usr/bin/boxmux", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/boxmux/README", mode = "644", doc = true },
]
