apiVersion: test.machinegenesis.dev/v1
kind: TestProject
metadata:
  name: boxmux
source:
  type: workspace
  root: .
  contents: tracked
  # The documentation site is not built or tested on the guests.
  exclude: ["docs/*"]
plans:
  - mg-test/hosts.yaml
  - mg-test/arm64.yaml
  - mg-test/freebsd.yaml
  - mg-test/release.yaml
defaults:
  allocationTimeout: 45m
  taskTimeout: 2h
