app:
  layouts:
    - id: "socket_pty_demo"
      title: "Socket PTY Spawn Demo"
      root: true
      children:
        - id: "instructions"
          title: "Socket PTY Spawn Instructions"
          position:
            x1: "5%"
            y1: "5%"
            x2: "95%"
            y2: "30%"
          border_color: "blue"
          content: |
            Start a process in a box from another terminal. Each script line is
            its own argument. The command reaches this instance through its
            control socket (pass --socket or set BOXMUX_SOCKET when several run).

            # Run a script in a terminal in pty_demo_box
            boxmux spawn_pty_process pty_demo_box 'echo Hello PTY' date 'sleep 2' 'echo Done'

            # Run it for source_box, showing the output in output_box
            boxmux spawn_pty_process source_box 'echo Redirected output' --redirect-output output_box

            # Look at, stop or restart the process
            boxmux query_pty_status pty_demo_box
            boxmux kill_pty_process pty_demo_box
            boxmux restart_pty_process pty_demo_box

        - id: "pty_demo_box"
          title: "PTY Demo Box - Target for Spawning"
          position:
            x1: "5%"
            y1: "35%"
            x2: "50%"
            y2: "65%"
          border_color: "green"
          content: "Ready to receive PTY processes via socket commands..."

        - id: "output_box"
          title: "Output Redirect Target"
          position:
            x1: "50%"
            y1: "35%"
            x2: "95%"
            y2: "65%"
          border_color: "cyan"
          content: "This box will receive redirected output from PTY spawns..."

        - id: "source_box"
          title: "Source Box for Redirect Testing"
          position:
            x1: "5%"
            y1: "70%"
            x2: "50%"
            y2: "95%"
          border_color: "yellow"
          content: "Use this box ID as source for redirect testing..."

        - id: "status_box"
          title: "Status and Control"
          position:
            x1: "50%"
            y1: "70%"
            x2: "95%"
            y2: "95%"
          border_color: "magenta"
          content: |
            PTY status commands:
            - Query: boxmux query_pty_status pty_demo_box
            - Kill: boxmux kill_pty_process pty_demo_box
            - Restart: boxmux restart_pty_process pty_demo_box
            - Signal: boxmux send_signal pty_demo_box 2