app:
  layouts:
    - id: "socket_pty_input_demo"
      title: "Socket PTY Input Demo"
      root: true
      children:
        - id: "instructions"
          title: "Socket PTY Input Instructions"
          position:
            x1: "5%"
            y1: "5%"
            x2: "95%"
            y2: "35%"
          border_color: "blue"
          content: |
            First start a shell in the box:
            boxmux spawn_pty_process interactive_shell 'echo Ready for commands' 'exec bash'

            Then type into it. Input is sent as given; use your shell's $'...'
            quoting for newlines and control characters:
            boxmux send_pty_input interactive_shell $'ls -la\n'
            boxmux send_pty_input interactive_shell $'cat > test.txt\n'
            boxmux send_pty_input interactive_shell $'Hello from remote input!\n'
            boxmux send_pty_input interactive_shell $'\x04'    # Ctrl+D ends cat's input
            boxmux send_pty_input interactive_shell $'ls -la | grep test\n'

            Query status and control:
            boxmux query_pty_status interactive_shell
            boxmux kill_pty_process interactive_shell

        - id: "interactive_shell"
          title: "Interactive Shell - PTY Target"
          position:
            x1: "5%"
            y1: "40%"
            x2: "65%"
            y2: "75%"
          border_color: "green"
          content: "Waiting for PTY process to be spawned via socket..."

        - id: "command_log"
          title: "Command Log & Examples"
          position:
            x1: "70%"
            y1: "40%"
            x2: "95%"
            y2: "75%"
          border_color: "cyan"
          content: |
            Input examples (bash $'...' quoting):

            Run a command:     $'uptime\n'
            Python:            $'python3\n' then $'print(2 + 2)\n'
            Interrupt:         $'\x03'   (Ctrl+C)
            End of input:      $'\x04'   (Ctrl+D)
            Escape:            $'\x1b'
            Tab completion:    $'ls /us\t'

        - id: "status_display"
          title: "Status & Control"
          position:
            x1: "5%"
            y1: "80%"
            x2: "95%"
            y2: "95%"
          border_color: "magenta"
          content: |
            Status Commands:
            Query: boxmux query_pty_status interactive_shell
            Kill: boxmux kill_pty_process interactive_shell
            Restart: boxmux restart_pty_process interactive_shell

            The interactive_shell box above will show the output of your commands.