# Plugin demo. Build the example plugin first:
#
#   cargo build --release --manifest-path examples/plugins/gauge/Cargo.toml
#
# then run `boxmux layouts/plugin_demo.yaml`.
app:
  plugins:
    # No extension: the platform's library name is used (libboxmux_gauge.so,
    # libboxmux_gauge.dylib or boxmux_gauge.dll).
    - path: ../examples/plugins/gauge/target/release/boxmux_gauge
  layouts:
    - id: 'main'
      root: true
      title: 'Plugin System Demo'
      bg_color: 'black'
      children:
        - id: 'gauges'
          title: 'Gauges (drawn by a plugin)'
          position: {x1: 10%, y1: 10%, x2: 90%, y2: 50%}
          border_color: 'magenta'
          fg_color: 'white'
          plugin_component: 'gauge'
          plugin_config:
            gauges:
              - {label: CPU, value: 42}
              - {label: Memory, value: 6.1, max: 16}
              - {label: Disk, value: 380, max: 512}

        - id: 'about'
          title: 'How it works'
          position: {x1: 10%, y1: 55%, x2: 90%, y2: 90%}
          border_color: 'cyan'
          fg_color: 'green'
          content: |
            The box above has plugin_component: gauge.
            boxmux loads the libraries listed under app.plugins at start
            and asks the plugin that offers the component to draw it,
            passing plugin_config and the size of the box as JSON.
            See examples/plugins/gauge for the source.
